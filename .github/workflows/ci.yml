name: Validate presenter kit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: presenter-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate artifacts, tests, and issue preview
        run: npm run demo:check
